<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 430" width="850" height="430">
  <defs>
    <style>
      @keyframes typeLine1 { 0%, 5% { width: 0; } 15%, 100% { width: 480px; } }
      @keyframes typeLine2 { 0%, 18% { width: 0; } 28%, 100% { width: 380px; } }
      @keyframes typeLine3 { 0%, 31% { width: 0; } 41%, 100% { width: 520px; } }
      @keyframes typeLine4 { 0%, 44% { width: 0; } 54%, 100% { width: 440px; } }
      @keyframes typeLine5 { 0%, 57% { width: 0; } 67%, 100% { width: 520px; } }
      @keyframes typeLine6 { 0%, 70% { width: 0; } 80%, 100% { width: 360px; } }
      @keyframes typeLine7 { 0%, 83% { width: 0; } 93%, 100% { width: 480px; } }
      @keyframes cursorBlink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes fadeIn {
        0% { opacity: 0; }
        100% { opacity: 1; }
      }
      @keyframes dotPulse {
        0%, 100% { fill: #330000; }
        50% { fill: #8b0000; }
      }
      .terminal-bg { fill: #0a0a0a; rx: 8; }
      .title-bar { fill: #111111; }
      .dot-red { fill: #8b0000; }
      .dot-yellow { fill: #332200; }
      .dot-green { fill: #003300; animation: dotPulse 3s ease-in-out infinite; }
      .title-text {
        font-family: 'Courier New', monospace;
        font-size: 11px;
        fill: #4a0000;
      }
      .prompt {
        font-family: 'Courier New', monospace;
        font-size: 13px;
        fill: #8b0000;
      }
      .command {
        font-family: 'Courier New', monospace;
        font-size: 13px;
        fill: #cc0000;
      }
      .output {
        font-family: 'Courier New', monospace;
        font-size: 12.5px;
        fill: #660000;
      }
      .output-key {
        font-family: 'Courier New', monospace;
        font-size: 12.5px;
        fill: #993333;
      }
      .output-val {
        font-family: 'Courier New', monospace;
        font-size: 12.5px;
        fill: #4a0000;
      }
      .cursor {
        fill: #cc0000;
        animation: cursorBlink 0.8s steps(1) infinite;
      }
      .comment {
        font-family: 'Courier New', monospace;
        font-size: 11px;
        fill: #1a0000;
        font-style: italic;
      }
      .line { overflow: hidden; }
      .l1 { animation: typeLine1 12s steps(40) infinite; }
      .l2 { animation: typeLine2 12s steps(40) infinite; }
      .l3 { animation: typeLine3 12s steps(40) infinite; }
      .l4 { animation: typeLine4 12s steps(40) infinite; }
      .l5 { animation: typeLine5 12s steps(40) infinite; }
      .l6 { animation: typeLine6 12s steps(40) infinite; }
      .l7 { animation: typeLine7 12s steps(40) infinite; }
    </style>
  </defs>

  <!-- Terminal window -->
  <rect class="terminal-bg" width="850" height="430"/>

  <!-- Title bar -->
  <rect class="title-bar" width="850" height="32" rx="8"/>
  <rect class="title-bar" width="850" height="16" y="16"/>

  <!-- Window dots -->
  <circle class="dot-red" cx="20" cy="16" r="5"/>
  <circle class="dot-yellow" cx="38" cy="16" r="5"/>
  <circle class="dot-green" cx="56" cy="16" r="5"/>

  <!-- Title -->
  <text class="title-text" x="425" y="20" text-anchor="middle">neverstare@shadow:~/.identity — bash — 80×24</text>

  <!-- Terminal content -->
  <!-- Command prompt -->
  <text class="prompt" x="20" y="62">neverstare@shadow:~$</text>
  <text class="command" x="215" y="62">cat /etc/shadow/identity.json</text>

  <!-- Output -->
  <text class="output" x="20" y="90">{</text>

  <text class="output-key" x="40" y="115">"codename"</text>
  <text class="output" x="140" y="115">:</text>
  <text class="output-val" x="155" y="115">"NeverStare",</text>

  <text class="output-key" x="40" y="140">"class"</text>
  <text class="output" x="115" y="140">:</text>
  <text class="output-val" x="130" y="140">"Ghost Operator | RE &amp; Mal Dev Specialist",</text>

  <text class="output-key" x="40" y="165">"weapons"</text>
  <text class="output" x="135" y="165">:</text>
  <text class="output-val" x="150" y="165">["Bash", "Zsh", "Python", "C", "Shell"],</text>

  <text class="output-key" x="40" y="190">"infra"</text>
  <text class="output" x="108" y="190">:</text>
  <text class="output-val" x="123" y="190">["Linux", "Docker", "AWS", "Kubernetes"],</text>

  <text class="output-key" x="40" y="215">"tools"</text>
  <text class="output" x="108" y="215">:</text>
  <text class="output-val" x="123" y="215">["Ghidra", "IDA Pro", "Burp", "Metasploit"],</text>

  <text class="output-key" x="40" y="240">"focus"</text>
  <text class="output" x="108" y="240">:</text>
  <text class="output-val" x="123" y="240">["Reverse Engineering", "Malware Development",</text>
  <text class="output-val" x="145" y="258">"Shell Manipulation", "Offensive Security"],</text>

  <text class="output-key" x="40" y="283">"motto"</text>
  <text class="output" x="108" y="283">:</text>
  <text class="output-val" x="123" y="283">"They told me not to stare. I never blink.",</text>

  <text class="output-key" x="40" y="308">"status"</text>
  <text class="output" x="122" y="308">:</text>
  <text class="output-val" x="137" y="308">"👁️ Always watching..."</text>

  <text class="output-key" x="40" y="333">"warning"</text>
  <text class="output" x="125" y="333">:</text>
  <text class="output-val" x="140" y="333">"I dissect binaries for breakfast."</text>

  <text class="output" x="20" y="358">}</text>

  <!-- Next prompt with blinking cursor -->
  <text class="prompt" x="20" y="410">neverstare@shadow:~$</text>
  <rect class="cursor" x="215" y="399" width="8" height="14"/>

  <!-- Faint comment -->
  <text class="comment" x="580" y="62"># CLASSIFIED</text>
</svg>
