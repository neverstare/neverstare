<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 20" width="900" height="20">
  <defs>
    <style>
      @keyframes scan {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 1; }
      }
    </style>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#050505;stop-opacity:1"/>
      <stop offset="20%" style="stop-color:#4a0000;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#8b0000;stop-opacity:1"/>
      <stop offset="80%" style="stop-color:#4a0000;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#050505;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:transparent"/>
      <stop offset="40%" style="stop-color:#cc0000;stop-opacity:0.6"/>
      <stop offset="50%" style="stop-color:#ff0000;stop-opacity:0.8"/>
      <stop offset="60%" style="stop-color:#cc0000;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:transparent"/>
    </linearGradient>
  </defs>
  <line x1="0" y1="10" x2="900" y2="10" stroke="url(#lineGrad)" stroke-width="1"/>
  <rect x="0" y="8" width="200" height="4" fill="url(#scanGrad)" style="animation: scan 3s linear infinite;"/>
  <circle cx="450" cy="10" r="3" fill="#8b0000" style="animation: pulse 2s ease-in-out infinite;"/>
  <circle cx="430" cy="10" r="1.5" fill="#4a0000" style="animation: pulse 2s ease-in-out infinite; animation-delay: 0.3s;"/>
  <circle cx="470" cy="10" r="1.5" fill="#4a0000" style="animation: pulse 2s ease-in-out infinite; animation-delay: 0.6s;"/>
</svg>
